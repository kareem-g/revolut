# Builds the powerk iOS app into an .ipa with GitHub Actions (macOS runner).
#
# Default: an UNSIGNED .ipa artifact — install it with Xcode/Sideloadly/AltStore
# (or sign it yourself). If you add the repo secrets below, the same job signs
# it so it can go to TestFlight / an ad-hoc install:
#
#   BUILD_CERTIFICATE_BASE64        — .p12 signing cert, base64
#   P12_PASSWORD                    — its password
#   BUILD_PROVISION_PROFILE_BASE64  — .mobileprovision, base64
#   KEYCHAIN_PASSWORD               — anything, e.g. "powerk"
#
# Run it from the Actions tab (workflow_dispatch) or on every push to main.

name: ios-ipa

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      PROJECT_DIR: mobile
      SCHEME: powerk
      CONFIGURATION: Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm ci --legacy-peer-deps

      - name: Generate native iOS project (expo prebuild)
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx expo prebuild --platform ios --no-install

      - name: Install pods
        working-directory: ${{ env.PROJECT_DIR }}/ios
        run: pod install

      # ---- optional signing (only when secrets are present) ----
      - name: Install signing certificate
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" | base64 --decode > $CERT_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install provisioning profile
        if: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 != '' }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo -n "${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}" | base64 --decode > $PP_PATH
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< \
            "$(security cms -D -i $PP_PATH)")
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV

      # ---- archive (unsigned unless a certificate was installed) ----
      - name: Archive
        working-directory: ${{ env.PROJECT_DIR }}/ios
        run: |
          if [ -n "$PROFILE_UUID" ]; then
            xcodebuild -workspace $SCHEME.xcworkspace \
              -scheme $SCHEME \
              -configuration $CONFIGURATION \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -archivePath $RUNNER_TEMP/powerk.xcarchive \
              archive
          else
            xcodebuild -workspace $SCHEME.xcworkspace \
              -scheme $SCHEME \
              -configuration $CONFIGURATION \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -archivePath $RUNNER_TEMP/powerk.xcarchive \
              archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          fi

      - name: Export signed IPA
        if: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 != '' }}
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/powerk.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates

      - name: Package unsigned IPA
        if: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 == '' }}
        run: |
          APP=$(find $RUNNER_TEMP/powerk.xcarchive/Products/Applications -maxdepth 1 -name '*.app')
          mkdir -p $RUNNER_TEMP/Payload
          cp -R "$APP" $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP && zip -qry powerk-unsigned.ipa Payload
          echo "IPA_PATH=$RUNNER_TEMP/powerk-unsigned.ipa" >> $GITHUB_ENV

      - name: Collect IPA path
        if: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 != '' }}
        run: |
          IPA=$(find $RUNNER_TEMP/export -name '*.ipa' 2>/dev/null | head -1)
          echo "IPA_PATH=$IPA" >> $GITHUB_ENV

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: powerk-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error

      - name: Clean up keychain and profile
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision 2>/dev/null || true
